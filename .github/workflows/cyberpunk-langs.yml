name: Cyberpunk Languages

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberpunk-langs-${{ github.ref }}

jobs:
  refresh-card:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Collect language bytes and draw the SVG
        env:
          # gh prefers GH_TOKEN and uses GITHUB_TOKEN when the PAT is absent.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/cyberpunk_langs.py

      - name: Publish the card if it changed
        run: |
          git add -- assets/most-used-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh the language card'

          # The activity workflow can update the README while this job is running.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              exit 0
            fi
          done
          exit 1
